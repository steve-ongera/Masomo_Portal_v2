<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f2f5c" />

    <title>masomo portal </title>
    <meta
      name="description"
      content="Official student portal for The Nyali School. Login to check exam results, fee statements, timetables and school announcements online, powered by Masomo Portal."
    />

    <meta
      name="keywords"
      content="The Nyali School, The Nyali School, The Nyali School portal, The Nyali School student portal, The Nyali School parent portal, The Nyali School login, The Nyali School results, The Nyali School KCSE results, The Nyali School exam results, The Nyali School fees, The Nyali School fee statement, The Nyali School fee balance, The Nyali School M-Pesa payment, The Nyali School timetable, The Nyali School admission, The Nyali School Mombasa, The Nyali School Mombasa, jundahighschool.co.ke, Masomo Portal, school portal Kenya, student portal Kenya, parent portal Kenya, high school management system Kenya, secondary school portal Kenya, CBC school portal Kenya"
    />

    <meta name="robots" content="index, follow" />
    <meta name="author" content="Steve Ongera" />
    <link rel="canonical" href="https://jundahighschool.co.ke/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Nyali School Portal" />
    <meta property="og:title" content="The Nyali School Student Portal | Results, Fees & Login" />
    <meta
      property="og:description"
      content="Results, fees, timetables and announcements for The Nyali School students and parents."
    />
    <meta property="og:url" content="https://jundahighschool.co.ke/" />
    <meta property="og:image" content="https://jundahighschool.co.ke/nyali_school_logo.png" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Nyali School Student Portal | Results, Fees & Login" />
    <meta
      name="twitter:description"
      content="Results, fees, timetables and announcements for The Nyali School students and parents."
    />
    <meta name="twitter:image" content="https://jundahighschool.co.ke/nyali_school_logo.png" />

    <!-- Favicon — school's own badge, falls back to Masomo Portal mark if none supplied -->
    <link rel="icon" type="image/png" href="/nyali_school_logo.png" />
    <link rel="apple-touch-icon" href="/nyali_school_logo.png" />

    <!-- Preconnect for faster CDN + font loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: Inter (UI) + IBM Plex Mono (figures, codes) — same pair as Medicore HMIS.
         Loaded here (not via @import in main.css) so they don't block CSS parsing. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      html, body { margin: 0; height: 100%; background: #f3f7fc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f7fc;
      }
      #boot-loader .ring {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 4px solid #e6f0fd;
        border-top-color: #1a4fa0;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "The Nyali School",
        "url": "https://jundahighschool.co.ke/",
        "sameAs": [
          "https://www.facebook.com/JundaHighSchool"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "KE"
        },
        "description": "The Nyali School's official student portal, provided by Masomo Portal.",
        "keywords": "The Nyali School portal, The Nyali School results, The Nyali School fees, The Nyali School login, The Nyali School, student portal Kenya, parent portal Kenya",
        "provider": {
          "@type": "Organization",
          "name": "Masomo Portal",
          "founder": {
            "@type": "Person",
            "name": "Steve Ongera"
          }
        }
      }
    </script>
  </head>

  <body>
    <!-- React replaces everything inside #root the moment it mounts -->
    <div id="root">
      <div id="boot-loader" role="status" aria-label="Loading The Nyali School portal">
        <div class="ring"></div>
      </div>
    </div>

    <noscript>The Nyali School Student Portal needs JavaScript enabled to run.</noscript>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
